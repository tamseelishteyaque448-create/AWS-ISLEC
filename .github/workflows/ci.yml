name: CI

# The four gates that must pass before anything is merged.
# Source of truth for these commands: docs/DEVELOPMENT.md and AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck, lint, build, unit guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The whitespace gate compares the actual push/PR range rather than
          # an empty clean worktree, so the merge base must be available.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Route types are generated by Next.js and are not committed, so they must
      # be produced before tsc runs or the check reports phantom AppRoutes errors.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Offline guards: no database, no network, no app server required. Fails
      # closed unless .env.e2e.local identifies a loopback app and the local
      # Supabase API, so this is safe to run with no secrets present.
      - name: Unit and disposable environment guards
        run: npm run test:unit

      - name: Ensure no whitespace damage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Ensure next-env.d.ts was not committed
        run: |
          if git ls-files --error-unmatch next-env.d.ts >/dev/null 2>&1; then
            echo "next-env.d.ts is tracked. It is generated by Next.js and flips"
            echo "between dev and build type paths, so it must stay ignored."
            exit 1
          fi
